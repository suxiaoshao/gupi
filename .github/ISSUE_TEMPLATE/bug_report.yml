name: Bug report
description: Report a reproducible Gupi defect.
title: "Gupi: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Describe what happens and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Gupi version, and Pi version.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Include relevant output with private data removed.

[package]
name = "gupi"
default-run = "gupi"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false
description = "A GPUI desktop host for Pi"
authors = ["suxiaoshao <48886207+suxiaoshao@users.noreply.github.com>"]
repository = "https://github.com/suxiaoshao/gupi"

[workspace.package]
version = "0.1.4"

[workspace]
members = [
  ".",
  "crates/gupi-conversation-ui",
  "crates/gupi-conversation",
  "crates/gupi-settings",
  "crates/gupi-screen-capture",
  "crates/gupi-updates",
  "crates/gupi-resources",
  "crates/gupi-pi-runtime",
  "crates/gpui-lucide",
  "crates/gpui-tokio",
  "crates/pi-rpc",
  "crates/window-ext",
  "crates/xtask",
]
resolver = "2"

[workspace.metadata.cargo-shear]
# gpui-lucide/build.rs consumes the upstream icons-dir build metadata.
ignored = ["gpui-component-assets"]

[workspace.dependencies]
# GPUI runtime and component versions are kept together.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-kit = "=0.7.1"
gpui-component = "=0.7.1"
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.7.1" }

# These services and their transitive workspace crates share one Git source.
app-theme = { version = "0.1.0", git = "https://github.com/suxiaoshao/gpui", rev = "9d7eb499bf6747b0c380976a5152f3b04c40de80", default-features = false }
gpui-form = { version = "0.1.0", git = "https://github.com/suxiaoshao/gpui", rev = "9d7eb499bf6747b0c380976a5152f3b04c40de80", features = ["garde-adapter"] }
gpui-operation = { version = "0.1.0", git = "https://github.com/suxiaoshao/gpui", rev = "9d7eb499bf6747b0c380976a5152f3b04c40de80" }
gpui-store = { version = "0.1.0", git = "https://github.com/suxiaoshao/gpui", rev = "9d7eb499bf6747b0c380976a5152f3b04c40de80" }
platform-ext = { version = "0.1.0", git = "https://github.com/suxiaoshao/gpui", rev = "9d7eb499bf6747b0c380976a5152f3b04c40de80" }

# Internal crates are released with Gupi.
gupi-conversation-ui = { version = "0.1.4", path = "crates/gupi-conversation-ui" }
gupi-conversation = { version = "0.1.4", path = "crates/gupi-conversation" }
gupi-screen-capture = { version = "0.1.4", path = "crates/gupi-screen-capture" }
gupi-settings = { version = "0.1.4", path = "crates/gupi-settings" }
gupi-updates = { version = "0.1.4", path = "crates/gupi-updates" }
gupi-resources = { version = "0.1.4", path = "crates/gupi-resources" }
gupi-pi-runtime = { version = "0.1.0", path = "crates/gupi-pi-runtime" }
gpui-lucide = { version = "0.1.0", path = "crates/gpui-lucide" }
gpui-tokio = { version = "0.1.0", path = "crates/gpui-tokio" }
pi-rpc = { version = "0.1.0", path = "crates/pi-rpc" }
window-ext = { version = "0.1.0", path = "crates/window-ext" }

[package.metadata.bundle]
name = "Gupi"
identifier = "top.sushao.gupi"
publisher = "CN=Sushao"
short_description = "A GPUI desktop host for Pi"
long_description = "Gupi provides a native desktop environment for Pi."
category = "DeveloperTool"
localizations = ["en-US", "zh-CN", "zh-TW", "ja", "ko", "de", "fr", "es", "pt-BR"]

[features]
# Enabled by xtask for distributable builds; source runs do not poll for updates.
bundled = ["gupi-settings/bundled", "gupi-updates/bundled"]
# Opt-in development tracing; never enabled by the bundle task.
performance = ["dep:tracing-chrome", "dep:profiling", "profiling/profile-with-tracing", "gupi-pi-runtime/performance", "gupi-conversation/performance", "gupi-conversation-ui/performance"]

[[bin]]
name = "gupi-update-helper"
path = "src/update_helper.rs"
required-features = ["bundled"]

[dependencies]
semver = "1.0.28"
# UI and workspace services.
gupi-conversation-ui.workspace = true
gupi-conversation.workspace = true
gupi-settings.workspace = true
gupi-screen-capture.workspace = true
gupi-updates.workspace = true
gupi-resources.workspace = true
gupi-pi-runtime.workspace = true
app-theme = { workspace = true, features = ["system-accent"] }
gpui-form.workspace = true
gpui-kit = { workspace = true, features = ["tree-sitter-languages"] }
gpui-operation.workspace = true
gpui-tokio.workspace = true
pi-rpc.workspace = true
window-ext.workspace = true
platform-ext.workspace = true

# Background tasks and Pi subprocess I/O.
smol = "2.0.2"

# Configuration, session data and local resources.
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
uuid = { version = "1.27.0", features = ["v4", "v5"] }

# Localization and diagnostics.
fluent-bundle = "0.16.0"
sys-locale = "0.3.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-chrome = { version = "0.7.2", optional = true }
profiling = { version = "1.0.18", optional = true }

[dev-dependencies]
gupi-settings = { workspace = true, features = ["test-support"] }
gupi-updates = { workspace = true, features = ["test-support"] }
gupi-resources = { workspace = true, features = ["test-support"] }
gupi-conversation = { workspace = true, features = ["test-support"] }
gupi-pi-runtime = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
global-hotkey = { version = "0.8.0", features = ["serde", "tracing"] }
get-selected-text = "0.1.6"
tray-icon = { version = "0.26.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = true

[profile.dev.package]
proc-macro2 = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16

[profile.performance]
inherits = "release-fast"
strip = "none"
debug-assertions = true

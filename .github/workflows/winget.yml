name: Prepare WinGet update

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public stable Gupi tag
        required: true
        type: string
      submit:
        description: Submit when eligible and WINGET_AUTOMATION_ENABLED is true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: winget-update
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.manifests.outputs.eligible }}
      version: ${{ steps.manifests.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        run: rustup show
      - name: Prepare archived manifests and check community state
        id: manifests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: cargo run -p xtask --locked -- winget --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/winget-manifests"
      - name: Save manifests for review or manual submission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-${{ steps.manifests.outputs.version }}
          path: ${{ runner.temp }}/winget-manifests/
          if-no-files-found: error
          retention-days: 30

  submit:
    needs: prepare
    if: >-
      needs.prepare.outputs.eligible == 'true' &&
      vars.WINGET_AUTOMATION_ENABLED == 'true' &&
      (github.event_name == 'release' || inputs.submit)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: winget-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/winget-manifests
      - name: Download pinned Microsoft manifest submission tool
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v1.12.13.0 --repo github.com/microsoft/winget-create --pattern wingetcreate.exe --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "Cannot download WinGetCreate" }
          $toolPath = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          $expectedHash = '24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea'
          if ((Get-FileHash $toolPath -Algorithm SHA256).Hash -ne $expectedHash) {
            throw "WinGetCreate checksum mismatch"
          }
      - name: Validate and submit the prepared manifest set
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_SUBMIT_TOKEN }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "Configure WINGET_SUBMIT_TOKEN before enabling submission"
          }
          & "$env:RUNNER_TEMP/wingetcreate.exe" submit --no-open --prtitle "New version: suxiaoshao.Gupi version $env:PACKAGE_VERSION" "$env:RUNNER_TEMP/winget-manifests"
          if ($LASTEXITCODE -ne 0) { throw "WinGet manifest validation or submission failed" }

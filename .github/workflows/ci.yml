name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether Rust checks are needed
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Manual runs and unavailable comparisons run the full checks.
          echo 'run=true' >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            exit 0
          fi
          if [[ "$EVENT" == pull_request ]]; then
            BASE=$(git merge-base "$BASE" "$HEAD")
          fi
          git diff --no-renames --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-files"
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|README.zh-CN.md|AGENTS.md|CLAUDE.md|docs/*|.agents/skills/*.md|.claude/skills) ;;
              *) exit 0 ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo 'run=false' >> "$GITHUB_OUTPUT"
          echo 'Documentation-only changes: skipping Rust builds, tests and Clippy.' >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: changes
    # Expand the matrix even for docs so required check names are preserved.
    # A failed classifier still runs the full checks.
    if: ${{ !cancelled() }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - name: Documentation-only changes
        if: ${{ needs.changes.outputs.run == 'false' }}
        run: echo 'Documentation-only changes; Rust checks are not needed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: ${{ needs.changes.outputs.run != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up native toolchain
        if: ${{ needs.changes.outputs.run != 'false' }}
        uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}

      - name: Cargo fmt
        if: ${{ needs.changes.outputs.run != 'false' }}
        run: cargo fmt --all -- --check

      - name: Cargo build
        if: ${{ needs.changes.outputs.run != 'false' }}
        run: cargo build --workspace --locked

      - name: Cargo test
        if: ${{ needs.changes.outputs.run != 'false' }}
        run: cargo test --workspace --locked

      - name: Cargo clippy
        if: ${{ needs.changes.outputs.run != 'false' }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

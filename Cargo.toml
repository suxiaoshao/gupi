[package]
name = "gupi"
default-run = "gupi"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "A GPUI desktop host for Pi"
authors = ["suxiaoshao <48886207+suxiaoshao@users.noreply.github.com>"]
repository = "https://github.com/suxiaoshao/gupi"

[workspace]
members = [
  ".",
  "crates/gpui-lucide",
  "crates/gpui-tokio",
  "crates/pi-rpc",
  "crates/window-ext",
  "crates/xtask",
]
resolver = "2"

[workspace.metadata.cargo-shear]
# gpui-lucide/build.rs consumes the upstream icons-dir build metadata.
ignored = ["gpui-component-assets"]

[workspace.dependencies]
# GPUI runtime and component versions are kept together.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui-kit = "=0.7.0"
gpui-component = "=0.7.0"
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.7.0" }

# These services and their transitive workspace crates share one Git source.
app-theme = { version = "0.1.0", git = "https://github.com/suxiaoshao/gpui", rev = "ca2c45f9bd96d24e06acfb7f445dcd2f6227273d", default-features = false }
gpui-form = { version = "0.1.0", git = "https://github.com/suxiaoshao/gpui", rev = "ca2c45f9bd96d24e06acfb7f445dcd2f6227273d", features = ["garde-adapter"] }
gpui-operation = { version = "0.1.0", git = "https://github.com/suxiaoshao/gpui", rev = "ca2c45f9bd96d24e06acfb7f445dcd2f6227273d" }
gpui-store = { version = "0.1.0", git = "https://github.com/suxiaoshao/gpui", rev = "ca2c45f9bd96d24e06acfb7f445dcd2f6227273d" }
platform-ext = { version = "0.1.0", git = "https://github.com/suxiaoshao/gpui", rev = "ca2c45f9bd96d24e06acfb7f445dcd2f6227273d" }

# Internal crates are released with Gupi.
gpui-lucide = { version = "0.1.0", path = "crates/gpui-lucide" }
gpui-tokio = { version = "0.1.0", path = "crates/gpui-tokio" }
pi-rpc = { version = "0.1.0", path = "crates/pi-rpc" }
window-ext = { version = "0.1.0", path = "crates/window-ext" }

[package.metadata.bundle]
name = "Gupi"
identifier = "top.sushao.gupi"
publisher = "CN=Sushao"
short_description = "A GPUI desktop host for Pi"
long_description = "Gupi provides a native desktop environment for Pi."
category = "DeveloperTool"
localizations = ["en-US", "zh-CN", "zh-TW", "ja", "ko", "de", "fr", "es", "pt-BR"]

[features]
# Enabled by xtask for distributable builds; source runs do not poll for updates.
bundled = []

[[bin]]
name = "gupi-update-helper"
path = "src/update_helper.rs"
required-features = ["bundled"]

[build-dependencies]
cc = "1.2.67"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
semver = "1.0.28"
regex = "1.13.1"
# UI and workspace services.
gpui-lucide.workspace = true
app-theme = { workspace = true, features = ["system-accent"] }
gpui-form.workspace = true
gpui-kit = { workspace = true, features = ["tree-sitter-languages"] }
gpui-operation.workspace = true
gpui-store.workspace = true
gpui-tokio.workspace = true
pi-rpc.workspace = true
window-ext.workspace = true
platform-ext.workspace = true

# Background tasks and Pi subprocess I/O.
smol = "2.0.2"
tokio = { version = "1.53.1", features = [
  "process",
  "io-util",
  "time",
  "macros",
  "sync",
  "fs",
] }

# Configuration, session data and local resources.
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
dirs-next = "2.0.0"
globset = "0.4.20"
ignore = "0.4.33"
markdown = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sonic-rs = "0.5.10"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["parsing", "formatting", "local-offset"] }
toml = "1.1.6"
trash = "5.2.9"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "v5"] }

# Localization and diagnostics.
fluent-bundle = "0.16.0"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
global-hotkey = { version = "0.8.0", features = ["serde", "tracing"] }
get-selected-text = "0.1.6"
tray-icon = { version = "0.25.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8.9"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = true

[profile.dev.package]
proc-macro2 = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16

[package]
name = "gupi-pi-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Gupi Pi instance, probe and execution environment ownership"

[lib]
path = "src/pi_runtime.rs"

[features]
test-support = []
performance = []

[dependencies]
gpui-kit.workspace = true
gpui-operation.workspace = true
gpui-tokio.workspace = true
pi-rpc.workspace = true
tokio = { version = "1.53.1", features = ["process", "io-util", "time", "macros", "sync"] }
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
dirs-next = "2.0.0"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

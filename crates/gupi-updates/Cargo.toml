[package]
name = "gupi-updates"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false

[features]
bundled = []
test-support = []

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
semver = "1.0.28"
# UI and workspace services.
gpui-kit.workspace = true
gpui-tokio.workspace = true

# Background tasks and Pi subprocess I/O.
smol = "2.0.2"
tokio = { version = "1.53.2", features = [
  "process",
  "io-util",
  "time",
  "macros",
  "sync",
  "fs",
] }

# Configuration, session data and local resources.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4", "v5"] }

# Localization and diagnostics.
thiserror = "2.0.21"


[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
http = "1.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.9.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }


[build-dependencies]
cc = "1.2.67"

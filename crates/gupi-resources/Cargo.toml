[package]
name = "gupi-resources"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false

[features]
test-support = []

[dependencies]
sha2 = "0.11.1"
regex = "1.13.1"
# UI and workspace services.
gpui-kit.workspace = true
gpui-operation.workspace = true
gpui-tokio.workspace = true
pi-rpc.workspace = true

# Background tasks and Pi subprocess I/O.
smol = "2.0.2"
tokio = { version = "1.54.0", features = [
  "process",
  "io-util",
  "time",
  "macros",
  "sync",
  "fs",
] }
dirs-next = "2.0.0"
globset = "0.4.20"
ignore = "0.4.33"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
trash = "5.2.9"
url = "2.5.8"
# Read-only package catalog requests.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

# Localization and diagnostics.
thiserror = "2.0.21"

gupi-pi-runtime.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
gupi-pi-runtime = { workspace = true, features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
